
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div>
            <p class="eyebrow">PAYMENT OPERATIONS</p>
            <h1>Edit Transaction #{{ transaction["id"] }}</h1>
        </div>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Update transaction</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" class="transaction-form edit-form">
                <label>
                    Merchant
                    <input type="text" name="merchant" maxlength="100"
                           value="{{ transaction['merchant'] }}" required>
                </label>

                <label>
                    Amount (₹)
                    <input type="number" name="amount" min="0.01"
                           max="1000000000" step="0.01"
                           value="{{ transaction['amount'] }}" required>
                </label>

                <label>
                    Status
                    <select name="status" required>
                        <option value="Success"
                            {% if transaction['status'] == 'Success' %}selected{% endif %}>
                            Success
                        </option>
                        <option value="Pending"
                            {% if transaction['status'] == 'Pending' %}selected{% endif %}>
                            Pending
                        </option>
                        <option value="Failed"
                            {% if transaction['status'] == 'Failed' %}selected{% endif %}>
                            Failed
                        </option>
                    </select>
                </label>

                <button type="submit">Save changes</button>
                <a href="{{ url_for('index') }}">Cancel and return</a>
            </form>
        </section>
    </main>
</body>
</html>
